name: Sync Upstream i18n

on:
  schedule:
    # Run daily at 02:00 UTC (10:00 AM Taipei)
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit and integration tests for sync script
        run: node scripts/i18n-sync.test.mjs

      - name: Fetch upstream main branch
        run: |
          git remote add upstream https://github.com/multica-ai/multica.git || true
          git fetch upstream main

      - name: Synchronize translations from upstream
        run: node scripts/i18n-sync.mjs --upstream-ref upstream/main

      - name: Verify locale namespace parity
        run: |
          node -e '
          import fs from "node:fs";
          import path from "node:path";
          const localesDir = path.resolve("packages/views/locales");
          const enFiles = fs.readdirSync(path.join(localesDir, "en")).filter(f => f.endsWith(".json")).sort();
          const hantFiles = fs.readdirSync(path.join(localesDir, "zh-Hant")).filter(f => f.endsWith(".json")).sort();
          if (JSON.stringify(enFiles) !== JSON.stringify(hantFiles)) {
            console.error("Mismatch between en and zh-Hant namespaces!");
            process.exit(1);
          }
          console.log(`Verified parity for ${hantFiles.length} namespaces.`);
          '

      - name: Create Pull Request if changes detected
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(i18n): sync zh-Hant translations with upstream"
          title: "chore(i18n): sync zh-Hant translations with upstream"
          body: |
            ## Upstream i18n Synchronization
            
            Detected changes in upstream `multica-ai/multica:main` and synchronized `packages/views/locales/zh-Hant/` accordingly.
            
            - Synced added, updated, and removed keys
            - Adhered to glossary standards in `apps/docs/content/docs/developers/conventions.zh.mdx`
            - Verified 100% namespace parity with `en`
          branch: auto-sync-i18n-zh-hant
          delete-branch: true
